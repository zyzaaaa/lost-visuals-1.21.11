name: build-jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/checkout@v4
        with:
          repository: FabricMC/fabric-example-mod
          ref: "1.21.11"
          path: tpl
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Распаковать мод и подставить в шаблон
        run: |
          mkdir mod
          for z in repo/*.zip; do unzip -q -o "$z" -d mod; done
          rm -rf tpl/src/main/java tpl/src/main/resources tpl/src/client
          if [ -d mod/src/main/java ]; then cp -r mod/src/main/java tpl/src/main/java; fi
          cp -r mod/src/main/resources tpl/src/main/resources
          mkdir -p tpl/src/client
          if [ -d mod/src/client/java ]; then cp -r mod/src/client/java tpl/src/client/java; fi
          if [ -d mod/src/client/resources ]; then cp -r mod/src/client/resources tpl/src/client/resources; fi
      - name: Сборка
        id: build
        continue-on-error: true
        working-directory: tpl
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Диагностика API
        if: always()
        run: |
          if [ -f mod/ci/diag.sh ]; then bash mod/ci/diag.sh; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag
          path: diag
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: |
            tpl/build/libs/*.jar
            !tpl/build/libs/*-sources.jar
          if-no-files-found: warn
      - name: Итог сборки
        if: steps.build.outcome == 'failure'
        run: exit 1
